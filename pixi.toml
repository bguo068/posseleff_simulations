slim = "4.1.*"
fastparquet = "0.8.3.*"
tskit = "0.5.2.*"
pyslim = "1.0.1.*"
demes = "0.2.2.*"
demesdraw = "0.3.1.*"
msprime = "1.2.0.*"
cxx-compiler = "1.7.0.*"
pybedtools = "0.10.0.*"
python-igraph = "0.10.0.*"
meson = "0.63.2.*"
ninja = "1.11.*"
pkg-config = "0.29.2.*"
ruff = ">=0.16.7,<0.17"
ty = ">=0.0.80,<0.0.81"
openjdk = "21.*"
nextflow = "23.*"
wget = ">=1.25.0,<2"

[pypi-dependencies]
ibdutils = { git = "https://github.com/bguo068/ibdutils", rev = "v0.1.2" }
