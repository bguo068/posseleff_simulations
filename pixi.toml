[workspace]
authors = ["Bing.Guo <bing.guo@som.umaryland.edu>"]
channels = ["conda-forge", "bioconda"]
name = "posseleff_simulations"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
# Build/download the tools the pipeline runs from bin/ (tskibd, hmmIBD, ibdne.jar).
setup = "python ./init.py"

[dependencies]
python = "3.10.6.*"
ipython = "8.10.0.*"
numpy = "1.23.3.*"
pandas = "1.5.0.*"
matplotlib = "3.6.0.*"
fastparquet = "0.8.3.*"
demes = "0.2.2.*"
demesdraw = "0.3.1.*"
cxx-compiler = "1.7.0.*"
pybedtools = "0.10.0.*"
python-igraph = "0.10.0.*"
meson = "0.63.2.*"
ninja = "1.11.*"
pkg-config = "0.29.2.*"
ruff = ">=0.16.7,<0.17"
ty = ">=0.0.80,<0.0.81"
openjdk = "21.*"
nextflow = "26.10.*"
wget = ">=1.25.0,<2"

[pypi-dependencies]
ibdutils = { git = "https://github.com/bguo068/ibdutils", rev = "v0.1.2" }

# The same versions on every platform. conda-forge and bioconda have no
# linux-aarch64 builds of them, so there they are built from source: these
# from PyPI (tskit against the environment's numpy), and SLiM by init.py.
[target.osx-arm64.dependencies]
scikit-allel = "1.3.8.*"
slim = "4.1.*"
tskit = "0.5.2.*"
pyslim = "1.0.1.*"
msprime = "1.2.0.*"

[target.linux-64.dependencies]
scikit-allel = "1.3.8.*"
slim = "4.1.*"
tskit = "0.5.2.*"
pyslim = "1.0.1.*"
msprime = "1.2.0.*"

[target.linux-aarch64.dependencies]
cmake = "*"
gsl = "2.7.*"
setuptools = "*"

[target.linux-aarch64.pypi-dependencies]
scikit-allel = "==1.3.8"
tskit = "==0.5.2"
pyslim = "==1.0.1"
msprime = "==1.2.0"

[pypi-options]
no-build-isolation = ["tskit"]
